name: CI

# Quality gate for changes that aren't yet on main. Pushes to main are validated
# and deployed by deploy.yml instead, so this skips main to avoid a redundant run.
#
# The check list is not here: it lives in `npm run verify` (scripts/verify.mjs),
# which builds, type-checks and runs every scripts/validate-*.mjs. deploy.yml runs
# the same command, so a deploy cannot ship past a check CI enforces — and adding a
# validator needs no edit to either workflow.
on:
  push:
    branches-ignore: [main]
  pull_request:
    branches: [main]

# Least privilege by default: this workflow only ever reads the repo.
permissions:
  contents: read

# A newer push to the same branch/PR supersedes an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node 24: the content scripts import .ts directly via type-stripping.
          node-version: 24
          cache: npm

      # `npm ci` runs the postinstall hook, which vendors the Stockfish engine
      # (~39 MB NNUE net) out of node_modules into public/engine.
      - name: Install dependencies
        run: npm ci

      # Advisories that actually reach a player. --omit=dev on purpose: this is a
      # static client-side app, so the Vite/esbuild/postcss build chain never ships
      # to a browser, and failing CI on a dev-only advisory would train everyone to
      # ignore it. `npm audit` (no flags) still reports those locally.
      - name: Audit shipped dependencies
        run: npm audit --audit-level=high --omit=dev

      - name: Verify (build, type-check, every validator)
        run: npm run verify
