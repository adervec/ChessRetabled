name: Deploy to GitHub Pages

# Ship the production build to GitHub Pages on every push to main.
#
# The deploy is gated on the *same* checks as CI: `npm run verify` builds (which
# is also the type-check) and runs every scripts/validate-*.mjs, so main cannot
# deploy past something CI would have failed. It used to run validate-lessons
# alone and ship whatever built. Can also be run manually.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Grant the token the scopes the Pages deploy action needs (OIDC + Pages write).
permissions:
  contents: read
  pages: write
  id-token: write

# Serialize deployments; never cancel one mid-flight (let it finish, queue the next).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node 24: the content scripts import .ts directly via type-stripping.
          node-version: 24
          cache: npm

      # `npm ci` runs the postinstall hook, which vendors the Stockfish engine
      # (~39 MB NNUE net) out of node_modules into public/engine.
      - name: Install dependencies
        run: npm ci

      # Advisories that actually reach a player. --omit=dev on purpose: this is a
      # static client-side app, so the Vite/esbuild/postcss build chain never ships
      # to a browser, and failing CI on a dev-only advisory would train everyone to
      # ignore it. `npm audit` (no flags) still reports those locally.
      - name: Audit shipped dependencies
        run: npm audit --audit-level=high --omit=dev

      # Builds under the project subpath (e.g. /ChessRetabled/) so absolute asset
      # URLs and the router basename resolve on Pages, then runs every validator
      # against that build. dist/ is what gets uploaded below, so the artifact is
      # exactly the tree the checks passed on.
      - name: Verify (build, type-check, every validator)
        run: npm run verify
        env:
          BASE_PATH: /${{ github.event.repository.name }}/

      # SPA fallback: Pages serves 404.html for unknown paths. Making it a copy
      # of index.html lets BrowserRouter handle deep links and refreshes.
      - name: Add SPA fallback
        run: cp dist/index.html dist/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Checks the site that is actually live (headless Chrome) and, if it is healthy,
  # tags the deployed commit deploy-YYYYMMDD-HHMM so a release can be found and
  # rolled back to. `contents: write` is for pushing that tag, nothing else.
  # ponytail: @main tracks the shared workflow, which is the point — pin a SHA
  # instead if an unreviewed change there should not be able to run here.
  after-deploy:
    needs: deploy
    uses: adervec/CoworkSyncHub/.github/workflows/after-deploy.yml@main
    with:
      url: https://adervec.github.io/ChessRetabled/
    permissions:
      contents: write
