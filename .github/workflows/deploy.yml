name: Deploy to GitHub Pages

# Ship the production build to GitHub Pages on every push to main. The build is
# validated (type-check via `npm run build`, plus lesson content) before it goes
# out, so a broken main never deploys. Can also be run manually.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Grant the token the scopes the Pages deploy action needs (OIDC + Pages write).
permissions:
  contents: read
  pages: write
  id-token: write

# Serialize deployments; never cancel one mid-flight (let it finish, queue the next).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node 24: the content scripts import .ts directly via type-stripping.
          node-version: 24
          cache: npm

      # `npm ci` runs the postinstall hook, which vendors the Stockfish engine
      # (~39 MB NNUE net) out of node_modules into public/engine.
      - name: Install dependencies
        run: npm ci

      - name: Validate lesson content
        run: node scripts/validate-lessons.mjs

      # Build under the project subpath (e.g. /ChessRetabled/) so absolute asset
      # URLs and the router basename resolve on Pages. `npm run build` also runs
      # tsc --noEmit, so a type error fails the deploy here.
      - name: Build
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/

      # SPA fallback: Pages serves 404.html for unknown paths. Making it a copy
      # of index.html lets BrowserRouter handle deep links and refreshes.
      - name: Add SPA fallback
        run: cp dist/index.html dist/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
