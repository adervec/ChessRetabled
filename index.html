<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <!-- Zoom stays enabled on purpose (blocking it fails WCAG 1.4.4); the
         double-tap delay is handled by touch-action in responsive.css.
         viewport-fit=cover lets the safe-area insets there do their job. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1b1530" />
    <meta
      name="description"
      content="ChessRetabled — a cel-shaded chess game. Play bots, take lessons, and crush tactics puzzles."
    />
    <!-- Fonts are self-hosted (see src/styles/fonts.css) — no Google Fonts CDN call at runtime. -->
    <title>ChessRetabled</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
